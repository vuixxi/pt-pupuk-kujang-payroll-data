<!DOCTYPE html>
<html lang="id" data-theme="default">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <link rel="icon" href="./assets/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="./css/index.css?v=2.2.2">
</head>
<body class="body--overflow">

        <source src="./assets/musics/backsound.mp3" type="audio/mpeg">
      </audio>
    </div>
    <header class="header" id="header"></header>

    <div class="notice notice--fixed js-notice">
      <p class="notice__text js-notice-text"></p>
